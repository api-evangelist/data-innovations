aid: data-innovations
name: Data Innovations
description: Data Innovations LLC is a clinical laboratory informatics company that builds enterprise
  laboratory management and instrument-connectivity software for hospitals, health systems, and diagnostic
  labs. Its flagship Instrument Manager middleware connects analyzers, laboratory information systems (LIS),
  and EHR platforms such as Epic Beaker and Oracle Cerner, while EP Evaluator supports method validation
  and quality control, and Lab GPS delivers operational analytics. The company helps clinical labs optimize
  productivity, connectivity, and risk management across regional, community, and federal health systems.
  Added to the API Evangelist network as a portfolio company of Battery Ventures.
